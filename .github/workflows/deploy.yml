name: AI Legacy CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t krishnna26/ai-legacy-backend:latest ./backend

      - name: Push backend image
        run: docker push krishnna26/ai-legacy-backend:latest

      - name: Build frontend image
        run: docker build -t krishnna26/ai-legacy-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push krishnna26/ai-legacy-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull krishnna26/ai-legacy-backend:latest
            docker pull krishnna26/ai-legacy-frontend:latest

            docker stop ai-legacy-backend || true
            docker rm ai-legacy-backend || true

            docker stop ai-legacy-frontend || true
            docker rm ai-legacy-frontend || true

            docker run -d \
              --name ai-legacy-backend \
              --network ai-legacy-network \
              --env-file backend.env \
              krishnna26/ai-legacy-backend:latest

            docker run -d \
              --name ai-legacy-frontend \
              --network ai-legacy-network \
              -p 80:80 \
              krishnna26/ai-legacy-frontend:latest