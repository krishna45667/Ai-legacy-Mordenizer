name: AI Legacy CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t krishnna26/ai-legacy-backend:latest ./backend

      - name: Push backend image
        run: docker push krishnna26/ai-legacy-backend:latest

      - name: Build frontend image
        run: docker build -t krishnna26/ai-legacy-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push krishnna26/ai-legacy-frontend:latest